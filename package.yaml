name: lib
spec-version: 0.36.0

default-extensions:
        - GeneralizedNewtypeDeriving
        - UndecidableSuperClasses
        - TypeFamilyDependencies
        - FunctionalDependencies
        - MultiParamTypeClasses
        - UndecidableInstances
        - ScopedTypeVariables
        - StandaloneDeriving
        - OverloadedStrings
        - FlexibleInstances
        - TypeApplications
        - FlexibleContexts
        - RecordWildCards
        - PatternSynonyms
        - ConstraintKinds
        - TemplateHaskell
        - DeriveAnyClass
        - KindSignatures
        - NamedFieldPuns
        - TypeOperators
        - DeriveGeneric
        - TupleSections
        - TypeFamilies
        - LambdaCase
        - RankNTypes
        - PolyKinds
        - DataKinds
        - Arrows
        - GADTs

dependencies:
        - discord-haskell
        - effectful-th
        - bytestring
        - containers
        - lens-aeson
        - effectful
        - aeson
        - lens
        - base
        - text
        - mtl

executables:
        lib:
                main: app/Main.hs
                dependencies:
                        - lib

library:
        source-dirs: src